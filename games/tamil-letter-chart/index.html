<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil Letter Chart | Kid Learning Games</title>
  <meta name="description" content="Explore all 247 Tamil letters and hear each one said by a real voice." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>அ</text></svg>" />
  <link href="../../assets/vendor/bootstrap.min.css" rel="stylesheet" />
  <link href="../../assets/css/common.css" rel="stylesheet" />
  <link href="../../assets/css/tamil-games.css" rel="stylesheet" />
</head>
<body class="tamil-activity">
  <a class="skip-link" href="#main-content">Skip to activity</a>
  <nav class="navbar navbar-dark klg-navbar mb-4">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">&larr; Kid Learning Games</a>
      <span class="navbar-text text-white tamil-glyph">அ Tamil Letter Chart</span>
    </div>
  </nav>

  <div class="container quiz-shell tg-wide pb-5">
    <section id="main-content" data-screen="chart-screen" class="card quiz-card p-3 p-md-4">
      <div class="tg-chart-head">
        <div>
          <h1 class="h3 fw-bold mb-1">Tamil Letter Chart</h1>
          <p class="tamil-glyph tg-subtitle mb-1">எழுத்து அட்டவணை · tap any letter to hear it</p>
          <p id="voice-note" class="tg-voice-note mb-0"></p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button id="play-all" type="button" class="tg-pill">▶ Play all</button>
          <button id="stop-audio" type="button" class="tg-pill">■ Stop</button>
        </div>
      </div>
      <div class="tg-tabs" role="tablist" aria-label="Letter groups">
        <button type="button" role="tab" id="tab-uyir" data-tab="uyir" aria-controls="chart-grid" class="tamil-glyph">உயிர் · Vowels</button>
        <button type="button" role="tab" id="tab-mei" data-tab="mei" aria-controls="chart-grid" class="tamil-glyph">மெய் · Consonants</button>
        <button type="button" role="tab" id="tab-uyirmei" data-tab="uyirmei" aria-controls="chart-grid" class="tamil-glyph">உயிர்மெய் · Compound</button>
      </div>
      <div id="chart-detail" class="tg-detail" aria-live="polite"></div>
      <div id="chart-grid" role="tabpanel" class="tg-chart"></div>
      <p class="tg-legend small text-muted mt-3 mb-0">Colours: <span class="tg-key short">குறில் short</span> <span class="tg-key long">நெடில் long</span> <span class="tg-key hard">வல்லினம் hard</span> <span class="tg-key soft">மெல்லினம் soft</span> <span class="tg-key middle">இடையினம் middle</span></p>
    </section>
  </div>

  <script src="../../assets/vendor/confetti.browser.min.js"></script>
  <script src="../../assets/js/sounds.js"></script>
  <script src="../../assets/js/progress.js"></script>
  <script src="../../assets/js/game-kit.js"></script>
  <script src="../../assets/js/tamil-games.js"></script>
  <script src="../../assets/js/tamil-kit.js"></script>
  <script src="../../assets/js/tamil-audio-manifest.js"></script>
  <script src="../../assets/js/tamil-audio.js"></script>
  <script src="../../assets/js/tamil-words-data.js"></script>
  <script src="game.js"></script>
</body>
</html>
